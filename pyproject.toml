[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soulillusions"
version = "1.0.0"
description = "SoulIllusions - An Incentives Inc. Production. A 60-mile open world city game where time is life."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Incentives Inc.", email = "contact@incentives.inc"}
]
keywords = ["game", "open-world", "browser-game", "time-currency", "crypto", "sci-fi", "in-time"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
soulillusions = "soulillusions.cli:main"

[project.urls]
Homepage = "https://github.com/singularitycurse26-svg/SoulIllusions"
Repository = "https://github.com/singularitycurse26-svg/SoulIllusions"
Issues = "https://github.com/singularitycurse26-svg/SoulIllusions/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soulillusions = ["*.py"]
